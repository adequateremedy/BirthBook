<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/birth-book.css">
    <title>Birth Book</title>
</head>
<body>

    <main id="birthBook">

        <!-- LOGIN SCREEN -->
        <section id="loginScreen" class="screen active">
            <div class="content-panel login-panel">
                <input type="password" id="passwordInput" placeholder="Enter Password">
                <button id="loginButton" class="primary-button">Enter</button>
                <p id="loginError" class="hidden error-text">Incorrect Password</p>
            </div>
        </section>

        <!-- INTRODUCTION -->
        <section id="introScreen" class="screen">
            <div class="content-panel">
                <div class="intro-text">
                    <img src="assets/Intro.png" alt="Intro">
                </div>
                <button id="beginButton" class="primary-button">Begin</button>
            </div>
        </section>

        <!-- EXPERIENCE SCREEN -->
        <section id="experienceScreen" class="screen">
            <div class="experience-container">
                <div class="progress-area">
                    <div id="experienceType">VISUAL</div>
                    <div id="experienceNumber">1 / 20</div>
                </div>

                <!-- VISUAL PLAYER -->
                <div id="videoContainer" class="media-container">
                    <video id="visualPlayer" playsinline preload="auto"></video>
                </div>

                <!-- AUDIO PLAYER -->
                <div id="audioContainer" class="media-container hidden">
                    <div class="audio-display">
                        <div class="audio-symbol">◇</div>
                        <div class="audio-label">Listen</div>
                    </div>
                    <audio id="audioPlayer" preload="auto"></audio>
                </div>

                <!-- QUESTION -->
                <div id="questionContainer" class="question-container hidden">
                    <p class="question-label">The imprint formed is </p>
                    <div id="choiceContainer" class="choice-container"></div>
                    <!-- REPEAT CONTAINER -->
                    <div id="repeatContainer" class="repeat-container hidden">
                        <button id="repeatButton" class="choice-button repeat-button">Repeat</button>
                    </div>
                </div>
            </div>
        </section>

        <!-- RESULT SCREEN -->
        <section id="resultScreen" class="screen">
            <div class="result-panel">
                <div class="result-heading">You have aligned with</div>
                <h1 id="courtName"></h1>
                <div id="courtDescription" class="court-description"></div>
                
                <!-- ACTION BUTTONS -->
                <div class="result-actions">
                    <button id="saveResultButton" class="primary-button">Save</button>
                    <button id="replayButton" class="primary-button">Replay</button>
                </div>
            </div>
        </section>

    </main>

    <script src="js/birth-book.js"></script>

</body>
</html>
